name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BIN_NAME: tui

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Create release bundle
        shell: pwsh
        run: |
          mkdir release

          mkdir release\${env:BIN_NAME}

          Copy-Item `
            target\release\${env:BIN_NAME}.exe `
            release\${env:BIN_NAME}\

          Copy-Item `
            models `
            release\${env:BIN_NAME}\models `
            -Recurse

          if (Test-Path README.md) {
            Copy-Item README.md release\${env:BIN_NAME}\
          }

          if (Test-Path LICENSE) {
            Copy-Item LICENSE release\${env:BIN_NAME}\
          }

          Compress-Archive `
            -Path release\${env:BIN_NAME}\* `
            -DestinationPath `
            ${env:BIN_NAME}-windows-x64.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            pkg-config \
            libasound2-dev

      - name: Build release
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/${BIN_NAME}

      - name: Create release bundle
        run: |
          mkdir -p release/${BIN_NAME}

          cp target/release/${BIN_NAME} \
            release/${BIN_NAME}/

          cp -r models \
            release/${BIN_NAME}/models

          if [ -f README.md ]; then
            cp README.md release/${BIN_NAME}/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE release/${BIN_NAME}/
          fi

          tar -czf \
            ${BIN_NAME}-linux-x64.tar.gz \
            -C release \
            ${BIN_NAME}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz

  macos:
    name: macOS Universal
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-apple-darwin
            aarch64-apple-darwin

      - name: Enable Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build Intel binary
        run: |
          cargo build \
            --release \
            --target x86_64-apple-darwin

      - name: Build Apple Silicon binary
        run: |
          cargo build \
            --release \
            --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p universal/${BIN_NAME}

          lipo -create \
            target/x86_64-apple-darwin/release/${BIN_NAME} \
            target/aarch64-apple-darwin/release/${BIN_NAME} \
            -output universal/${BIN_NAME}/${BIN_NAME}

      - name: Strip binary
        run: strip universal/${BIN_NAME}/${BIN_NAME}

      - name: Copy assets
        run: |
          cp -r models \
            universal/${BIN_NAME}/models

          if [ -f README.md ]; then
            cp README.md universal/${BIN_NAME}/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE universal/${BIN_NAME}/
          fi

      - name: Create archive
        run: |
          tar -czf \
            ${BIN_NAME}-macos-universal.tar.gz \
            -C universal \
            ${BIN_NAME}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
