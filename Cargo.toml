[package]
name = "tui"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
flate2 = "1.0.24"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
zip = "8.6.0"
rig = { package = "rig-core", version = "0.37.0" }
futures = "0.3"
cpal = "0.15"
hound = "3.5"
rodio = "0.20"
tokenizers = "0.19"
sherpa-onnx = "1.13.2"
crossbeam-channel = "0.5"
rubato = "0.15"

[dev-dependencies]
actix-web = "4.13.0"
csv = "1.4.0"
error-chain = "0.12.4"
rhai = "1.24.0"
select = "0.6.1"
tempfile = "3.27.0"
